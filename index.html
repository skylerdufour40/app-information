<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3efe6">
  <meta name="description" content="App information and installation details.">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Paste here</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3efe6;
      --ink: #20241e;
      --muted: #687066;
      --line: #d7d2c7;
      --accent: #d95d39;
      --accent-dark: #b84526;
      --panel: #fbfaf6;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
    }

    main {
      width: min(100% - 40px, 760px);
      margin: 0 auto;
      padding: 72px 0 48px;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--accent-dark);
      font: 700 0.78rem/1.2 system-ui, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 620px;
      margin: 0;
      font-size: clamp(3rem, 9vw, 6.5rem);
      font-weight: 400;
      line-height: 0.92;
      letter-spacing: -0.04em;
    }

    .intro {
      max-width: 540px;
      margin: 28px 0 46px;
      color: var(--muted);
      font: 1.08rem/1.6 system-ui, sans-serif;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
      background: var(--panel);
    }

    .detail {
      min-height: 112px;
      padding: 22px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    dt {
      margin-bottom: 12px;
      color: var(--muted);
      font: 700 0.72rem/1.2 system-ui, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    dd {
      margin: 0;
      font-size: 1.15rem;
      overflow-wrap: anywhere;
    }

    .install {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-top: 28px;
      padding: 24px 26px;
      background: var(--ink);
      color: var(--paper);
    }

    .install p {
      margin: 0;
      font: 700 1rem/1.35 system-ui, sans-serif;
    }

    button {
      flex: 0 0 auto;
      border: 0;
      padding: 13px 18px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font: 700 0.86rem system-ui, sans-serif;
    }

    button:hover { background: var(--accent-dark); }
    button:focus-visible { outline: 3px solid #f3c4b6; outline-offset: 3px; }

    @media (max-width: 560px) {
      main { width: min(100% - 28px, 760px); padding-top: 48px; }
      .details { grid-template-columns: 1fr; }
      .install { align-items: stretch; flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">App information</p>
    <h1>Paste here</h1>
    <p class="intro">Everything you need to identify this app before installing it on your iPhone or iPad.</p>

    <dl class="details">
      <div class="detail"><dt>App Name</dt><dd>Paste here</dd></div>
      <div class="detail"><dt>Bundle ID</dt><dd>Paste here</dd></div>
      <div class="detail"><dt>Version</dt><dd>Paste here</dd></div>
      <div class="detail"><dt>Platform</dt><dd>iOS</dd></div>
      <div class="detail"><dt>Minimum OS</dt><dd>Paste here</dd></div>
      <div class="detail"><dt>Binary Size</dt><dd>Paste here</dd></div>
    </dl>

    <section class="install" aria-label="Install this app">
      <p>Install the app on your Home Screen</p>
      <button id="install-button" type="button">Install app</button>
    </section>
  </main>

  <script>
    let deferredPrompt;
    const installButton = document.querySelector('#install-button');

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      deferredPrompt = event;
      installButton.hidden = false;
    });

    installButton.addEventListener('click', async () => {
      if (!deferredPrompt) {
        window.alert('In Safari, tap Share, then choose Add to Home Screen.');
        return;
      }
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installButton.hidden = true;
    });

    window.addEventListener('appinstalled', () => {
      installButton.hidden = true;
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
